name: Proof HTML
run-name: ${{ github.actor }} is validating the push.
on: [push]
jobs:
  validate-html_css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: validate-html_css
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          check_favicon: false
          check_css: true
